[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ponder-multi-agent"
version = "0.1.0"
description = "Robot tool layer (standalone MCP server) for the Misty multi-agent system."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.28",
    "websocket-client",  # used by the vendored mistyPy SDK in real mode
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ponder-robot-tools = "robot_tools.server:main"

[tool.setuptools.packages.find]
include = ["robot_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
